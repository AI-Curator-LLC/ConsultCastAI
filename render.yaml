# Render Blueprint for ConsultCastAI: both the FastAPI backend and the
# static frontend, deployed together. Deploy by connecting this repo in
# the Render dashboard: New -> Blueprint.
#
# Storage: practice sessions are local-JSON and user accounts are a local
# SQLite file, both on the persistent Render Disk below, not Firestore or a
# managed database, consistent with the rest of this deploy staying entirely
# on Render. Fine at solo-founder/small-cohort scale (single instance; a
# service with a disk attached can't scale out anyway).
#
# User accounts could instead live in Render Postgres (users.py supports it:
# CONSULTCASTAI_LOCAL_USERS=0 + DATABASE_URL + psycopg2-binary in
# requirements.txt), but Render's FREE Postgres tier expires after 30 days,
# which would delete every account, so that's deliberately not declared here.
# If you add one, use a paid plan.
services:
  - type: web
    name: consultcastai-api
    runtime: python
    plan: 0.5c-512mb  # "Starter" in the Render dashboard; the plan field wants this raw compute-spec id, not the display name
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: consultcastai-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Secrets and per-deploy values: fill these in via the Render
      # dashboard after the first deploy (sync: false means Render prompts
      # for a value instead of expecting one here, and never commits it).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANAM_API_KEY
        sync: false
      - key: CONSULTCASTAI_JWT_SECRET  # signs login tokens: a long random string (32+ chars), generate once, never commit
        sync: false
      - key: RESEND_API_KEY  # verification emails; unset just skips sending, it never blocks signup
        sync: false
      - key: CONSULTCASTAI_ALLOWED_ORIGINS  # the frontend's Render URL, e.g. "https://consultcastai-frontend.onrender.com"
        sync: false

      # Fixed for this deploy shape (local storage on the disk above, real
      # auth enforced, production CORS mode). Change here, not in the
      # dashboard, so it stays in version control.
      - key: CONSULTCASTAI_ENV
        value: production
      - key: CONSULTCASTAI_LOCAL_STORE
        value: "1"
      - key: CONSULTCASTAI_LOCAL_STORE_PATH
        value: /data/sessions_local.json
      - key: CONSULTCASTAI_LOCAL_USERS
        value: "1"
      - key: CONSULTCASTAI_USERS_DB_PATH
        value: /data/users.db
      - key: CONSULTCASTAI_DEV_AUTH_BYPASS
        value: "0"  # the whole point of this deploy: local storage, real auth
      # Where the emailed verification link points, and where it lands afterward.
      - key: CONSULTCASTAI_BACKEND_URL
        value: https://consultcastai-api.onrender.com
      - key: CONSULTCASTAI_FRONTEND_URL
        value: https://consultcastai-frontend.onrender.com

  # Static frontend: only frontend/ is published (index.html + assets/),
  # kept in its own directory specifically so this can't accidentally
  # expose the backend's Python source alongside it.
  - type: web
    name: consultcastai-frontend
    runtime: static
    staticPublishPath: frontend
