# Render Blueprint for ConsultCastAI: both the FastAPI backend and the
# static frontend, deployed together. Deploy by connecting this repo in
# the Render dashboard: New -> Blueprint.
#
# Storage: practice sessions are local-JSON and user accounts are a local
# SQLite file, both on the persistent Render Disk below, not Firestore or a
# managed database, consistent with the rest of this deploy staying entirely
# on Render. Fine at solo-founder/small-cohort scale (single instance; a
# service with a disk attached can't scale out anyway).
#
# User accounts could instead live in Render Postgres (users.py supports it:
# CONSULTCASTAI_LOCAL_USERS=0 + DATABASE_URL + psycopg2-binary in
# requirements.txt), but Render's FREE Postgres tier expires after 30 days,
# which would delete every account, so that's deliberately not declared here.
# If you add one, use a paid plan.
services:
  - type: web
    name: consultcastai-api
    runtime: python
    plan: 0.5c-512mb  # "Starter" in the Render dashboard; the plan field wants this raw compute-spec id, not the display name
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: consultcastai-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Secrets and per-deploy values: fill these in via the Render
      # dashboard after the first deploy (sync: false means Render prompts
      # for a value instead of expecting one here, and never commits it).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANAM_API_KEY
        sync: false
      - key: CONSULTCASTAI_JWT_SECRET  # signs login tokens: a long random string (32+ chars), generate once, never commit
        sync: false
      - key: RESEND_API_KEY  # verification emails; unset just skips sending, it never blocks signup
        sync: false
      - key: CONSULTCASTAI_ALLOWED_ORIGINS  # comma-separated, exact origins, no trailing slash. Must list EVERY address the frontend is served from (the onrender.com URL and the custom domain), or the browser blocks its API calls
        sync: false
      # Set this to YOUR OWN login email. That account is promoted to
      # admin+approved automatically (whether it already exists or signs up
      # fresh). Without an admin there's no accounts view and nobody who can
      # suspend an account. It's also where "someone signed up" notification
      # emails go. (Approval itself is automatic now, on email verification.)
      - key: CONSULTCASTAI_ADMIN_EMAIL
        sync: false
      # Single sign-on with the AI Curator Consulting Suite (suite_sso.py).
      # The same value as AICSUITE_SSO_SECRET_CONSULTCASTAI on the suite, 32+
      # characters. Blank keeps single sign-on off here whatever the suite
      # says. Whether it is ON is the suite's switch, not a setting here.
      - key: SUITE_SSO_SECRET
        sync: false
      # Stripe: real recurring subscriptions — Pro ($129/mo or $1,316/yr, one
      # account) and Team ($599/mo or $6,110/yr, up to 5 seats pooling one
      # subscription), both renew automatically until canceled via Stripe's
      # own Customer Portal. Create both products with both Prices each in
      # the Stripe dashboard first, then set these from Stripe's own
      # dashboard values. STRIPE_WEBHOOK_SECRET comes from adding an
      # endpoint in Stripe for
      # https://consultcastai-api.onrender.com/billing/webhook listening for
      # checkout.session.completed, invoice.payment_succeeded,
      # customer.subscription.deleted, and invoice.payment_failed. Billing
      # endpoints fail closed (not open) if any of these are unset — nobody
      # gets free access from a missing key.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_TEAM_MONTHLY
        sync: false
      - key: STRIPE_PRICE_TEAM_ANNUAL
        sync: false
      # Extra practice minutes (see README's "Paid minutes and top-ups"): the
      # id of a ONE-TIME Stripe Price ($40) for one block of 100 minutes.
      # Blank: the "Add minutes" button is not shown and nothing else
      # changes. The webhook endpoint above also needs the event
      # checkout.session.async_payment_succeeded added to it.
      - key: STRIPE_PRICE_ID_TOPUP
        sync: false

      # Fixed for this deploy shape (local storage on the disk above, real
      # auth enforced, production CORS mode). Change here, not in the
      # dashboard, so it stays in version control.
      - key: CONSULTCASTAI_ENV
        value: production
      - key: CONSULTCASTAI_LOCAL_STORE
        value: "1"
      - key: CONSULTCASTAI_LOCAL_STORE_PATH
        value: /data/sessions_local.json
      # Was defaulting to a relative path (usage_local.json) in the app's own
      # working directory, not the persistent disk — every deploy/restart
      # silently reset everyone's monthly usage record. Caught while adding
      # the retention job below, which also reads/writes this file.
      - key: CONSULTCASTAI_USAGE_STORE_PATH
        value: /data/usage_local.json
      - key: CONSULTCASTAI_LOCAL_USERS
        value: "1"
      - key: CONSULTCASTAI_USERS_DB_PATH
        value: /data/users.db
      - key: CONSULTCASTAI_DEV_AUTH_BYPASS
        value: "0"  # the whole point of this deploy: local storage, real auth
      # Data retention (see retention.py and README's "Data retention,
      # deletion, and export" section): how long transcripts, debriefs, and
      # a lapsed subscription's sessions are kept before deletion. Defaults
      # match these values already, listed here so they're one edit away
      # without a code change and stay in version control either way.
      - key: TRANSCRIPT_RETENTION_DAYS
        value: "90"
      - key: DEBRIEF_RETENTION_DAYS
        value: "365"
      - key: POST_CANCEL_GRACE_DAYS
        value: "90"
      # Trial cap (see minutes.py and README's "Trial and minutes tracking"
      # section): an approved account that has never subscribed gets this
      # much practice in total, at most this much per session. Defaults
      # match these values already; listed here so they're one edit away.
      - key: TRIAL_TOTAL_MINUTES
        value: "10"
      - key: TRIAL_SESSION_MINUTES
        value: "10"
      - key: TRIAL_WARNING_SECONDS
        value: "60"
      # Avatar sessions, on every plan: the longest one sitting can run, and
      # how long before that the warning shows. Anam closes a connection at
      # its own plan's maximum session length, so keep this at that maximum:
      # 10 on Explorer, 120 on Growth or Professional. After upgrading Anam,
      # change AVATAR_SESSION_MINUTES here or in the Render dashboard
      # (Environment); the service restarts and new sessions use it. Nothing
      # else needs to change. Voice-only sessions are not affected.
      - key: AVATAR_SESSION_MINUTES
        value: "10"
      - key: AVATAR_WARNING_SECONDS
        value: "60"
      # Paid minutes (see minutes.py and README's "Paid minutes and
      # top-ups"). Pro: this many minutes each calendar month (UTC) for the
      # one account. Team: this many a month, shared by the team (one pool
      # for the owner and every member). Defaults match these values already.
      - key: PRO_MONTHLY_MINUTES
        value: "120"
      - key: TEAM_MONTHLY_MINUTES
        value: "1000"
      # One block of extra minutes, and the price shown on its button. The
      # amount actually charged is the Stripe Price in STRIPE_PRICE_ID_TOPUP:
      # keep this label the same as that Price.
      - key: TOPUP_BLOCK_MINUTES
        value: "100"
      - key: TOPUP_PRICE_LABEL
        value: "$40"
      - key: PAID_WARNING_SECONDS
        value: "60"
      # The switch for the whole paid cap. "0": paid plans are recorded but
      # never limited and show no counter, exactly as before the cap existed.
      # Can be changed in the Render dashboard without a code change.
      - key: PAID_MINUTES_ENFORCED
        value: "1"
      # "1": a person whose AI Curator Consulting Suite plan is active is
      # treated as Pro here (with Pro's minutes) when they arrive through
      # the suite. "0": the suite's plan gives nothing here.
      - key: SUITE_PLAN_GRANTS_PRO
        value: "1"
      # Accounts one IP can create per rolling 24 hours (see README's signup
      # guards). Team-invite signups are exempt.
      - key: SIGNUPS_PER_IP_PER_DAY
        value: "3"
      # Where the emailed verification link points, and where it lands afterward.
      - key: CONSULTCASTAI_BACKEND_URL
        value: https://consultcastai-api.onrender.com
      - key: CONSULTCASTAI_FRONTEND_URL
        value: https://consultcastai.ai-curator.ai  # the custom domain, so emailed reset/verify links land there, not on the onrender.com address

  # Static frontend: only frontend/ is published (index.html + assets/),
  # kept in its own directory specifically so this can't accidentally
  # expose the backend's Python source alongside it.
  - type: web
    name: consultcastai-frontend
    runtime: static
    staticPublishPath: frontend
